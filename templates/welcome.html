<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Email</title>

</head>

<body>

<table
    data-edit="email-background"
    width="600"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="
        width:100%;
        max-width:600px;
        margin:auto;
        background-color:#eff6ff;
        font-family:Arial,Helvetica,sans-serif;
    "
>

    <tr>

        <td
            align="center"
            style="
                padding:28px 20px;
                background-color:#ffffff;
            "
        >

            <img
                data-edit="logo"
                src="images/brand-image.png"
                alt="Brand Logo"
                width="140"
                height="50"
                style="
                    display:block;
                    object-fit:contain;
                "
            >

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:38px 30px 20px;
                background-color:#eff6ff;
            "
        >

            <p
                style="
                    margin:0 0 10px;
                    font-size:13px;
                    font-weight:bold;
                    letter-spacing:2px;
                    color:#2563eb;
                "
            >
                WELCOME TO THE COMMUNITY
            </p>


            <h1
                data-edit="heading"
                style="
                    margin:0;
                    font-size:36px;
                    line-height:1.2;
                    color:#1e3a8a;
                "
            >
                WELCOME ABOARD!
            </h1>


            <p
                style="
                    margin:12px 0 0;
                    color:#64748b;
                    font-size:15px;
                "
            >
                We're happy to have you here.
            </p>

        </td>

    </tr>


    <tr>

        <td align="center">

            <img
                data-edit="banner"
                src="images/brand-image.png"
                alt="Welcome to our community"
                width="560"
                height="260"
                style="
                    display:block;
                    width:93%;
                    max-width:560px;
                    height:auto;
                "
            >

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:30px 45px 15px;
                background-color:#ffffff;
            "
        >

            <p
                data-edit="paragraph"
                style="
                    margin:0;
                    font-size:16px;
                    line-height:1.8;
                    color:#475569;
                "
            >
                Thank you for joining our community. We're excited
                to have you with us and can't wait to show you
                everything we have to offer.
            </p>

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:20px 20px 40px;
                background-color:#ffffff;
            "
        >

            <a
                data-edit="button"
                href="https://example.com"
                style="
                    display:inline-block;
                    padding:15px 34px;
                    background-color:#2563eb;
                    color:#ffffff;
                    text-decoration:none;
                    font-size:15px;
                    font-weight:bold;
                    border-radius:6px;
                "
            >
                GET STARTED
            </a>

        </td>

    </tr>


    <tr>

        <td
            data-edit="footer"
            align="center"
            style="
                padding:20px;
                background-color:#172554;
                color:#bfdbfe;
                font-size:12px;
            "
        >

            © 2026 Your Company · We're glad you're here.

        </td>

    </tr>

</table>

</body>

</html>
