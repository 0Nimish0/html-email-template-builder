<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monthly Newsletter</title>

</head>

<body>

<table
    data-edit="email-background"
    width="600"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="
        width:100%;
        max-width:600px;
        margin:auto;
        background-color:#f8fafc;
        font-family:Arial,Helvetica,sans-serif;
    "
>

    <tr>

        <td
            align="center"
            style="
                padding:28px 20px 18px;
                background-color:#ffffff;
            "
        >

            <img
                data-edit="logo"
                src="images/brand-image.png"
                alt="Brand Logo"
                width="140"
                height="50"
                style="
                    display:block;
                    object-fit:contain;
                "
            >

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:30px 30px 22px;
                background-color:#ffffff;
            "
        >

            <p
                style="
                    margin:0 0 10px;
                    font-size:12px;
                    font-weight:bold;
                    letter-spacing:3px;
                    color:#7c3aed;
                "
            >
                MONTHLY UPDATE
            </p>


            <h1
                data-edit="heading"
                style="
                    margin:0;
                    font-size:34px;
                    line-height:1.2;
                    color:#312e81;
                "
            >
                THE LATEST NEWS
            </h1>

        </td>

    </tr>


    <tr>

        <td align="center">

            <img
                data-edit="banner"
                src="images/brand-image.png"
                alt="Latest news and updates"
                width="560"
                height="270"
                style="
                    display:block;
                    width:93%;
                    max-width:560px;
                    height:auto;
                "
            >

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:30px 45px 15px;
                background-color:#ffffff;
            "
        >

            <p
                data-edit="paragraph"
                style="
                    margin:0;
                    font-size:16px;
                    line-height:1.8;
                    color:#475569;
                "
            >
                Discover our latest updates, new products,
                helpful tips and exciting announcements in
                this month's newsletter.
            </p>

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:20px 20px 35px;
                background-color:#ffffff;
            "
        >

            <a
                data-edit="button"
                href="https://example.com"
                style="
                    display:inline-block;
                    padding:14px 32px;
                    background-color:#7c3aed;
                    color:#ffffff;
                    text-decoration:none;
                    font-size:14px;
                    font-weight:bold;
                    border-radius:6px;
                "
            >
                READ MORE
            </a>

        </td>

    </tr>


    <tr>

        <td
            data-edit="footer"
            align="center"
            style="
                padding:20px;
                background-color:#1e1b4b;
                color:#c4b5fd;
                font-size:12px;
            "
        >

            © 2026 Your Company · You're receiving this email because you subscribed.

        </td>

    </tr>

</table>

</body>

</html>
