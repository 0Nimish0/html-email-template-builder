<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summer Sale</title>

</head>

<body>

<table
    data-edit="email-background"
    width="600"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="
        width:100%;
        max-width:600px;
        margin:auto;
        background-color:#fff7ed;
        font-family:Arial,Helvetica,sans-serif;
    "
>

    <tr>

        <td
            align="center"
            style="
                padding:25px 20px;
                background-color:#ffffff;
            "
        >

            <img
                data-edit="logo"
                src="images/brand-image.png"
                alt="Brand Logo"
                width="140"
                height="50"
                style="
                    display:block;
                    object-fit:contain;
                "
            >

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:35px 30px 15px;
                background-color:#fff7ed;
            "
        >

            <p
                style="
                    margin:0 0 10px;
                    font-size:13px;
                    font-weight:bold;
                    letter-spacing:2px;
                    color:#ea580c;
                "
            >
                LIMITED TIME OFFER
            </p>


            <h1
                data-edit="heading"
                style="
                    margin:0;
                    font-size:38px;
                    color:#9a3412;
                "
            >
                SUMMER SALE
            </h1>


            <p
                data-edit="subheading"
                style="
                    margin:12px 0 0;
                    font-size:20px;
                    font-weight:bold;
                    color:#ea580c;
                "
            >
                UP TO 50% OFF
            </p>

        </td>

    </tr>


    <tr>

        <td align="center">

            <img
                data-edit="banner"
                src="images/brand-image.png"
                alt="Summer sale promotion"
                width="560"
                height="260"
                style="
                    display:block;
                    width:93%;
                    max-width:560px;
                    height:auto;
                "
            >

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:30px 45px 15px;
                background-color:#ffffff;
            "
        >

            <p
                data-edit="paragraph"
                style="
                    margin:0;
                    font-size:16px;
                    line-height:1.7;
                    color:#4b5563;
                "
            >
                Refresh your style this summer with our latest
                collection. Enjoy special prices for a limited time.
            </p>

        </td>

    </tr>


    <tr>

        <td
            align="center"
            style="
                padding:20px 30px 35px;
                background-color:#ffffff;
            "
        >

            <a
                data-edit="button"
                href="https://example.com"
                style="
                    display:inline-block;
                    padding:15px 34px;
                    background-color:#ea580c;
                    color:#ffffff;
                    font-size:15px;
                    font-weight:bold;
                    text-decoration:none;
                    border-radius:6px;
                "
            >
                SHOP NOW
            </a>

        </td>

    </tr>


    <tr>

        <td
            data-edit="footer"
            align="center"
            style="
                padding:20px;
                background-color:#431407;
                color:#fed7aa;
                font-size:12px;
            "
        >

            © 2026 Your Company · All rights reserved.

        </td>

    </tr>

</table>

</body>

</html>
