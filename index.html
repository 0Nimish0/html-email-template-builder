<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Template Builder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <div class="nav-container">

            <div class="logo-area">

                <img
                    src="images/brand-image.png"
                    alt="Email Builder Logo"
                >

                <select id="template-select">

                    <option value="templates/sale.html">
                        Sale Campaign
                    </option>

                    <option value="templates/welcome.html">
                        Welcome Email
                    </option>

                    <option value="templates/newsletter.html">
                        Newsletter
                    </option>

                </select>

            </div>


            <div class="title">

                <h3>Email Template Builder</h3>

                <p>Create and customize email campaigns</p>

            </div>


            <div class="view-buttons">

                <button id="mobile-view">
                    Phone
                </button>

                <button id="desktop-view">
                    PC
                </button>

            </div>

        </div>

    </nav>


    <main>

        <div id="main">


            <!-- Preview -->

            <section id="preview-section">

                <div class="section-title">

                    <h3>Template Preview</h3>

                    <p>See your email before sending it.</p>

                </div>


                <div id="preview-wrapper">

                    <div id="template-preview"></div>

                </div>

            </section>



            <!-- Editor -->

            <section id="edit-section">

                <div class="section-title">

                    <h3>Edit Template</h3>

                    <p>Customize your email content and design.</p>

                </div>


                <div id="editor-controls">

                </div>

            </section>


        </div>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
